<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" role="img" aria-label="Pacho's Quality Auto Repair — established 2006, Miami, Florida">
  <title>Pacho's Quality Auto Repair — Est. 2006, Miami, Florida</title>
  <defs>
    <linearGradient id="emG" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFD870"/>
      <stop offset="0.45" stop-color="#FFB020"/>
      <stop offset="1" stop-color="#FF6A12"/>
    </linearGradient>
  </defs>

  <!-- brake-rotor ring -->
  <circle cx="65" cy="65" r="61" fill="none" stroke="url(#emG)" stroke-width="2.6"/>
  <circle cx="65" cy="65" r="50" fill="none" stroke="url(#emG)" stroke-width="1" opacity="0.35"/>

  <!-- rotor vent slots -->
  <g fill="url(#emG)" opacity="0.55">
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(0 65 65)"/>
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(30 65 65)"/>
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(60 65 65)"/>
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(90 65 65)"/>
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(120 65 65)"/>
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(150 65 65)"/>
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(180 65 65)"/>
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(210 65 65)"/>
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(240 65 65)"/>
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(270 65 65)"/>
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(300 65 65)"/>
    <rect x="63.2" y="7.5" width="3.6" height="9" rx="1.8" transform="rotate(330 65 65)"/>
  </g>

  <!-- P mark -->
  <g transform="translate(65 53) scale(0.44) translate(-50 -50)">
    <path fill="url(#emG)" fill-rule="evenodd"
