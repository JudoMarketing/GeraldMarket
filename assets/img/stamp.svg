<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img"
     aria-label="Pacho's Quality Auto Repair, established 2006, Miami Florida">
  <title>Pacho's Quality Auto Repair — Est. 2006</title>
  <!-- Rubber approval stamp, the kind pressed onto a finished work order -->
  <g fill="none" stroke="#E5502A" stroke-width="4">
    <rect x="6" y="6" width="248" height="148" rx="4"/>
  </g>
  <g fill="none" stroke="#E5502A" stroke-width="1.6" opacity="0.85">
    <rect x="15" y="15" width="230" height="130" rx="2"/>
  </g>

  <g fill="#E5502A">
    <text x="130" y="45" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace"
          font-size="11" font-weight="600" letter-spacing="4.5">★ ESTABLISHED ★</text>

    <text x="130" y="83" text-anchor="middle" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
          font-size="42" font-weight="700" letter-spacing="1">PACHO'S</text>

    <text x="130" y="103" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, monospace"
          font-size="10" font-weight="600" letter-spacing="3.2">QUALITY AUTO REPAIR</text>

    <rect x="46" y="113" width="168" height="1.6"/>

    <text x="130" y="136" text-anchor="middle" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif"
          font-size="24" font-weight="700" letter-spacing="2">2006 · MIAMI FL</text>
  </g>
</svg>
