<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Gerald Market">
  <title>Gerald Market</title>
  <!-- Cuatro velas: dos rojas, dos verdes. Encima, la línea amarilla — el
       trazo que el trader dibuja sobre el gráfico. -->
  <g stroke-linecap="butt">
    <!-- vela 1, baja -->
    <line x1="6"  y1="11" x2="6"  y2="27" stroke="#FF3D57" stroke-width="1.4"/>
    <rect x="3"  y="14" width="6" height="10" fill="#FF3D57" rx="1"/>
    <!-- vela 2, baja -->
    <line x1="14" y1="15" x2="14" y2="34" stroke="#FF3D57" stroke-width="1.4"/>
    <rect x="11" y="19" width="6" height="11" fill="#FF3D57" rx="1"/>
    <!-- vela 3, sube -->
    <line x1="22" y1="10" x2="22" y2="31" stroke="#00D68F" stroke-width="1.4"/>
    <rect x="19" y="13" width="6" height="14" fill="#00D68F" rx="1"/>
    <!-- vela 4, sube -->
    <line x1="30" y1="3"  x2="30" y2="24" stroke="#00D68F" stroke-width="1.4"/>
    <rect x="27" y="6"  width="6" height="14" fill="#00D68F" rx="1"/>
  </g>
  <path d="M2 31.5 L37 7.5" fill="none" stroke="#FFD400" stroke-width="2.4" stroke-linecap="round"/>
</svg>
