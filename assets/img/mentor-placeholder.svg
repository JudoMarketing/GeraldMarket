<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img"
     aria-label="Espacio reservado para la fotografía del mentor">
  <title>Foto pendiente</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E141B"/>
      <stop offset="1" stop-color="#070B10"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#131C25" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="800" fill="url(#g)"/>
  <rect width="640" height="800" fill="url(#grid)"/>

  <!-- silueta, en la mitad superior -->
  <g fill="none" stroke="#2A3644" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="320" cy="250" r="80"/>
    <path d="M180 452c0-72 63-116 140-116s140 44 140 116"/>
  </g>

  <!-- rótulo, en su propia franja libre -->
  <g font-family="ui-monospace, 'JetBrains Mono', monospace" text-anchor="middle">
    <text x="320" y="536" fill="#FFD400" font-size="19" letter-spacing="6">FOTO PENDIENTE</text>
    <text x="320" y="568" fill="#63707E" font-size="15" letter-spacing="2">Reemplazar por el retrato real</text>
  </g>

  <!-- velas al pie, sin tocar el rótulo -->
  <g opacity="0.42">
    <g fill="#FF3D57" stroke="#FF3D57" stroke-width="2">
      <line x1="70"  y1="672" x2="70"  y2="762"/><rect x="60"  y="690" width="20" height="56" rx="2"/>
      <line x1="130" y1="700" x2="130" y2="788"/><rect x="120" y="716" width="20" height="58" rx="2"/>
    </g>
    <g fill="#00D68F" stroke="#00D68F" stroke-width="2">
      <line x1="190" y1="642" x2="190" y2="752"/><rect x="180" y="658" width="20" height="78" rx="2"/>
      <line x1="250" y1="614" x2="250" y2="716"/><rect x="240" y="628" width="20" height="72" rx="2"/>
    </g>
    <g fill="#FF3D57" stroke="#FF3D57" stroke-width="2">
      <line x1="310" y1="620" x2="310" y2="726"/><rect x="300" y="638" width="20" height="72" rx="2"/>
    </g>
    <g fill="#00D68F" stroke="#00D68F" stroke-width="2">
      <line x1="370" y1="606" x2="370" y2="712"/><rect x="360" y="620" width="20" height="76" rx="2"/>
      <line x1="430" y1="626" x2="430" y2="722"/><rect x="420" y="642" width="20" height="66" rx="2"/>
      <line x1="490" y1="596" x2="490" y2="700"/><rect x="480" y="612" width="20" height="74" rx="2"/>
      <line x1="550" y1="608" x2="550" y2="704"/><rect x="540" y="622" width="20" height="68" rx="2"/>
    </g>
  </g>
  <path d="M56 744 L570 614" fill="none" stroke="#FFD400" stroke-width="3" opacity="0.4" stroke-linecap="round"/>
</svg>
