<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img"
     aria-label="Espacio reservado para la fotografía del mentor">
  <title>Foto pendiente</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B242F"/>
      <stop offset="0.55" stop-color="#0E151D"/>
      <stop offset="1" stop-color="#080C12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="55%">
      <stop offset="0" stop-color="#E9C46A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E9C46A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="800" fill="url(#g)"/>
  <rect width="640" height="800" fill="url(#glow)"/>

  <!-- silueta -->
  <g fill="none" stroke="#3A4756" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="320" cy="300" r="86"/>
    <path d="M172 528c0-78 66-126 148-126s148 48 148 126"/>
  </g>

  <g text-anchor="middle">
    <text x="320" y="620" fill="#E9C46A" font-family="ui-monospace, 'JetBrains Mono', monospace"
          font-size="18" letter-spacing="6">FOTO PENDIENTE</text>
    <text x="320" y="652" fill="#63707E" font-family="ui-monospace, 'JetBrains Mono', monospace"
          font-size="14" letter-spacing="2">Reemplazar por el retrato real</text>
  </g>

  <line x1="240" y1="676" x2="400" y2="676" stroke="#E9C46A" stroke-opacity="0.35" stroke-width="1"/>
</svg>
