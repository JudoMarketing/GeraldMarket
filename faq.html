{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Do I need an appointment?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Walk-ins are welcome, but booking ahead means we can reserve a bay and get to your car faster \u2014 especially for oil changes, tires and alignments on Saturdays. You can book online in under two minutes."
      }
    },
    {
      "@type": "Question",
      "name": "Will I get a price before you start working?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Always. We inspect the vehicle, then give you an estimate. Nothing gets repaired until you approve it. If we find something else along the way, we call you first."
      }
    },
    {
      "@type": "Question",
      "name": "What is a VIN and why do you ask for it?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The VIN is the 17-character number stamped on your dashboard at the base of the windshield, on the driver's door jamb sticker, and on your insurance card and registration. It tells us the exact engine, trim and factory options on your car so we can order the right parts the first time. It is helpful but completely optional."
      }
    },
    {
      "@type": "Question",
      "name": "Do you offer a warranty on your work?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes \u2014 most repairs are covered by a parts-and-labor warranty. Coverage varies by the part and the type of repair, so ask us for the exact terms on your specific service."
      }
    },
    {
      "@type": "Question",
      "name": "Can I wait while my car is serviced?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For quick jobs like oil changes, tire rotations and battery replacement, yes. For bigger repairs, dropping the car off is usually the better move."
      }
    },
    {
      "@type": "Question",
      "name": "Do you work on European cars?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. We regularly service domestic, Asian and European vehicles."
      }
    },
    {
      "@type": "Question",
      "name": "How do I pay?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We accept cash and major credit and debit cards."
      }
    },
    {
      "@type": "Question",
      "name": "Do you speak Spanish?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. The whole team speaks Spanish, and this entire website works in Spanish too."
      }
    }
  ]
}
</script>
